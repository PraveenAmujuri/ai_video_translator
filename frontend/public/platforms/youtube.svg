<svg width="350" height="900" viewBox="0 0 350 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#d8d8d8"/>
      <stop offset="40%" stop-color="#eeeeee"/>
      <stop offset="60%" stop-color="#8a8a8a"/>
      <stop offset="80%" stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#5e5e5e"/>
    </linearGradient>
  </defs>

  <!-- TOP HALF: Monochrome Chrome Card -->
  <g>
    <rect x="0" y="0" width="350" height="450" fill="url(#chrome)"/>
    <rect x="10" y="10" width="330" height="430" rx="12" fill="none" stroke="#222222" stroke-width="1.5" stroke-opacity="0.4"/>
    <g transform="translate(110, 180)">
      <path d="M130 10H20C9 10 0 19 0 30v40c0 11 9 20 20 20h110c11 0 20-9 20-20V30c0-11-9-20-20-20z" fill="#222222"/>
      <polygon points="60,30 60,70 100,50" fill="url(#chrome)"/>
    </g>
  </g>

  <!-- BOTTOM HALF: Brand Colored Card -->
  <g>
    <rect x="0" y="450" width="350" height="450" fill="#FFFFFF"/>
    <rect x="10" y="460" width="330" height="430" rx="12" fill="none" stroke="#ff0000" stroke-width="1.5" stroke-opacity="0.3"/>
    <g transform="translate(110, 630)">
      <path d="M130 10H20C9 10 0 19 0 30v40c0 11 9 20 20 20h110c11 0 20-9 20-20V30c0-11-9-20-20-20z" fill="#FF0000"/>
      <polygon points="60,30 60,70 100,50" fill="#FFFFFF"/>
    </g>
  </g>
</svg>