<svg width="350" height="900" viewBox="0 0 350 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#d8d8d8"/>
      <stop offset="40%" stop-color="#eeeeee"/>
      <stop offset="60%" stop-color="#8a8a8a"/>
      <stop offset="80%" stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#5e5e5e"/>
    </linearGradient>
  </defs>

  <!-- TOP HALF: Monochrome Chrome Card -->
  <g>
    <rect x="0" y="0" width="350" height="450" fill="url(#chrome)"/>
    <rect x="10" y="10" width="330" height="430" rx="12" fill="none" stroke="#222222" stroke-width="1.5" stroke-opacity="0.4"/>
    <g transform="translate(100, 160)">
      <rect x="0" y="30" width="150" height="100" rx="20" fill="none" stroke="#222222" stroke-width="10"/>
      <line x1="30" y1="0" x2="60" y2="30" stroke="#222222" stroke-width="10" stroke-linecap="round"/>
      <line x1="120" y1="0" x2="90" y2="30" stroke="#222222" stroke-width="10" stroke-linecap="round"/>
      <circle cx="45" cy="70" r="10" fill="#222222"/>
      <circle cx="105" cy="70" r="10" fill="#222222"/>
      <path d="M55,100 Q75,115 95,100" fill="none" stroke="#222222" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>

  <!-- BOTTOM HALF: Brand Colored Card -->
  <g>
    <rect x="0" y="450" width="350" height="450" fill="#00A1D6"/>
    <rect x="10" y="460" width="330" height="430" rx="12" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3"/>
    <g transform="translate(100, 610)">
      <rect x="0" y="30" width="150" height="100" rx="20" fill="none" stroke="#FFFFFF" stroke-width="10"/>
      <line x1="30" y1="0" x2="60" y2="30" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
      <line x1="120" y1="0" x2="90" y2="30" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
      <circle cx="45" cy="70" r="10" fill="#FFFFFF"/>
      <circle cx="105" cy="70" r="10" fill="#FFFFFF"/>
      <path d="M55,100 Q75,115 95,100" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    </g>
  </g>
</svg>